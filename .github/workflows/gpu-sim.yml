name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this runs
# the regression test (tests/run_tests.py, compared with tests/expected.json)
# on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim).
# A simulator has no timing model and cannot reproduce hardware-specific
# behavior, so it complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cuda/*.cu"
      - "cuda/*.cuh"
      - "cuda/*.h"
      - "cuda/Makefile"
      - "tests/**"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Regression test (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # compute_90 embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Build the FP32 benchmark
        run: make -C cuda build/lbm_bench ARCH="-arch=compute_90 -cudart shared"

      # Same two cases as `make -C cuda test`. The script prints one PASS or
      # FAIL line per quantity (6 in total) and "all tests passed" at the end;
      # anything else, including a missing or partial run, fails the step.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          vgpu run python3 tests/run_tests.py cuda/build/lbm_bench | tee test.log
          grep -qx "all tests passed" test.log
          test "$(grep -c '^PASS ' test.log)" -eq 6
          if grep -q '^FAIL ' test.log; then
            echo "::error::a check failed"
            exit 1
          fi
